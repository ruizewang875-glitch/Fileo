<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 555" width="760" height="555"><title>Studio interview notes</title><rect x="0" y="0" width="760" height="555" rx="0" fill="#fcfbf7"/><text x="49" y="83" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="36" font-weight="600" fill="#3b3c40" >Interview notes</text><text x="49" y="130" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#69706c" >18 October</text><text x="49" y="212" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="600" fill="#343c38" >Observation</text><text x="49" y="371" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" font-weight="600" fill="#343c38" >Follow-up</text><text x="49" y="254" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="400" fill="#484b48" >Files stay close while a project is active.</text><text x="49" y="293" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="400" fill="#484b48" >“I keep the first sketch.”</text><text x="49" y="412" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="400" fill="#484b48" >– Which drafts tell the story best?</text><text x="49" y="450" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="400" fill="#484b48" >– What feels safe to archive?</text></svg>
