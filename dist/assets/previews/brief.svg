<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 808" width="644" height="808"><title>Creative files — research brief</title><rect x="0" y="0" width="644" height="808" rx="0" fill="#fffefa"/><text x="53" y="105" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="650" fill="#283e58" >Research brief</text><text x="53" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#536576" >Creative files in everyday practice</text><text x="53" y="247" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#33567a" >Research question</text><text x="53" y="294" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >What makes a project file worth keeping</text><text x="53" y="325" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >after the project is finished?</text><text x="53" y="414" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#33567a" >Interview plan</text><text x="53" y="461" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >Ask four design students to walk through</text><text x="53" y="492" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >a recent cleanup. Let each choose one file</text><text x="53" y="523" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >they kept and one they let go.</text><text x="53" y="611" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#33567a" >Deliverables</text><text x="53" y="658" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >Map the decisions, the risks students see,</text><text x="53" y="689" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >and the reasons they return to old work.</text></svg>
