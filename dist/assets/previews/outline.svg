<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 808" width="644" height="808"><title>Creative files — study outline</title><rect x="0" y="0" width="644" height="808" rx="0" fill="#fffefa"/><text x="53" y="105" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="650" fill="#283e58" >Study outline</text><text x="53" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#536576" >Creative files in everyday practice</text><text x="53" y="251" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#33567a" >Questions for the field</text><text x="53" y="319" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#33567a" >1.</text><text x="95" y="319" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#292d35" >How do drafts accumulate?</text><text x="53" y="384" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#33567a" >2.</text><text x="95" y="384" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#292d35" >Where do students keep backups?</text><text x="53" y="449" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650" fill="#33567a" >3.</text><text x="95" y="449" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#292d35" >When does deleting feel risky?</text><text x="53" y="562" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#33567a" >Interview method</text><text x="53" y="609" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >To decide: follow one project or compare</text><text x="53" y="640" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#364151" >several recent ones?</text></svg>
